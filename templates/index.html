{% extends "base.html" %}

{% block content %}

    <!-- ===================== HERO ===================== -->
    <section class="hero" id="inicio">
        <div class="hero__image">
            <!-- Coloca tu imagen real en static/images/hero/hero.jpg -->
            <img src="{{ url_for('static', filename='images/hero/hero.jpg') }}" alt="Men's Shirts - Moda masculina">
        </div>

        <div class="hero__content">
            <h1>{{ brand_name }}</h1>
            <p class="hero__slogan">{{ slogan }}</p>
            <p class="hero__text">
                Playeras y accesorios para hombre pensados para acompañar tu estilo todos los días.
            </p>

            <div class="hero__buttons">
                <a href="#coleccion" class="btn btn--primary">VER COLECCIÓN</a>
                <a href="#reservar" class="btn btn--secondary">RESERVAR PEDIDO</a>
            </div>
        </div>
    </section>

{% endblock %}
