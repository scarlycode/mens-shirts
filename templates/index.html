<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ site_title }}</title>
</head>
<body>
    <h1>{{ brand_name }}</h1>
    <p>{{ slogan }}</p>

    <h2>Productos (prueba de datos)</h2>
    <ul>
        {% for product in products %}
            <li>{{ product.name }} - {{ product.description }}</li>
        {% endfor %}
    </ul>

    <p>WhatsApp configurado: {{ whatsapp_number }}</p>
</body>
</html>
